name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: Moodle ${{ matrix.moodle-branch }} / ${{ matrix.database }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        moodle-branch: [MOODLE_405_STABLE, MOODLE_500_STABLE]
        database: [mariadb, pgsql]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=5
        ports: [5432:5432]
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=5
        ports: [3306:3306]
    env:
      DB: ${{ matrix.database }}
      MOODLE_BRANCH: ${{ matrix.moodle-branch }}
      NVM_DIR: /home/runner/.nvm
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: this-plugin
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          ini-values: max_input_vars=5000
          tools: composer
          coverage: pcov
      - name: Initialise Moodle Plugin CI
        run: |
          composer create-project --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci 4.5.11
          echo "$(pwd)/ci/bin" >> "$GITHUB_PATH"
          echo "$(pwd)/ci/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
      - name: Install Moodle and Course Rating dependency
        id: install
        run: |
          git clone --branch MOODLE_405_STABLE --single-branch https://github.com/marinaglancy/moodle-tool_courserating.git extra-plugins/tool_courserating
          git -C extra-plugins/tool_courserating checkout 7e94aa78adbc3fc6c7b5a683e43da7f0fa046afd
          moodle-plugin-ci install --db-host=127.0.0.1 --plugin this-plugin --extra-plugins extra-plugins
      - name: PHP syntax
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci phplint
      - name: PHP mess detector
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci phpmd
      - name: PHP documentation
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci phpdoc
      - name: Coding standard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci codechecker
      - name: Plugin validation
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci validate
      - name: Upgrade savepoints
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci savepoints
      - name: JavaScript build and feature syntax
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci grunt
      - name: Mustache templates
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci mustache
      - name: PHPUnit including rating integration
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci phpunit --testdox --coverage-text --coverage-clover --fail-on-skipped --fail-on-warning
      - name: Behat Firefox Boost
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci behat --auto-rerun=0
      - name: Behat Chrome Boost
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci behat --profile chrome --auto-rerun=0
      - name: Behat Firefox Classic
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci behat --suite classic --auto-rerun=0
      - name: Behat Chrome Classic
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci behat --suite classic --profile chrome --auto-rerun=0
      - name: Save test diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.moodle-branch }}-${{ matrix.database }}
          path: |
            moodledata/behat_dump
            coverage.xml
          retention-days: 7
          if-no-files-found: ignore
